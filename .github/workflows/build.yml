name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p www scripts
          for f in index.html app.js parser.js style.css; do [ -f "$f" ] && mv "$f" www/ || true; done
          for f in copy-vendor.js patch-android.js; do [ -f "$f" ] && mv "$f" scripts/ || true; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          npm install
          npm run vendor
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
          node scripts/patch-android.js
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dhakkirni-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
